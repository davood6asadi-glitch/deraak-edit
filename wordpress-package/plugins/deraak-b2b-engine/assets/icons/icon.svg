<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1352DF" />
      <stop offset="100%" stop-color="#031A54" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBDA58" />
      <stop offset="100%" stop-color="#CFB343" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#031A54" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Base with Squircle Safe Margin for Maskable Icons -->
  <rect width="512" height="512" rx="112" fill="url(#primaryGrad)" />

  <!-- Outer Concentric Industrial Caliper Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#C6CDFE" stroke-width="6" stroke-opacity="0.25" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="148" fill="none" stroke="#5879FB" stroke-width="8" stroke-opacity="0.4" />

  <!-- Precision Transmitter & Signal Core -->
  <g filter="url(#shadow)">
    <!-- Central Sensor Body -->
    <rect x="176" y="200" width="160" height="150" rx="24" fill="#031A54" stroke="#C6CDFE" stroke-width="6" />

    <!-- Process Display Screen -->
    <rect x="196" y="224" width="120" height="68" rx="14" fill="#093596" stroke="#5879FB" stroke-width="3" />
    
    <!-- Digital Wave / Telemetry on Screen in Gold -->
    <path d="M 210,258 L 228,258 L 238,240 L 252,274 L 264,248 L 274,258 L 302,258" fill="none" stroke="#FBDA58" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Industrial Process Flange & Connection -->
    <path d="M 232,350 L 232,400 L 220,408 L 292,408 L 280,400 L 280,350 Z" fill="#93A3FC" />

    <!-- Antenna / Sensor Stem -->
    <path d="M 244,140 L 268,140 L 262,200 L 250,200 Z" fill="#5879FB" />
    
    <!-- High Precision Radar Horn Top in Brilliant Gold -->
    <ellipse cx="256" cy="136" rx="46" ry="16" fill="url(#goldGrad)" stroke="#151102" stroke-width="3" />
    <circle cx="256" cy="136" r="8" fill="#151102" />
  </g>

  <!-- Industrial Precision Gear Teeth Accents -->
  <g fill="#FBDA58" opacity="0.95">
    <circle cx="256" cy="64" r="10" />
    <circle cx="448" cy="256" r="10" />
    <circle cx="256" cy="448" r="10" />
    <circle cx="64" cy="256" r="10" />
  </g>
</svg>
